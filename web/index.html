  <!--  RAZORPAY FUNCTION -->
  <script>
    function openRazorpay(amount) {
      var options = {
        "key": "rzp_test_SmoH9K7exjlZF4",
        "amount": amount,
        "currency": "INR",
        "name": "QAPTO",
        "description": "Deal Payment",
        "handler": function (response) {
          alert("Payment Successful: " + response.razorpay_payment_id);
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
